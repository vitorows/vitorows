name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Roda uma vez por dia
  workflow_dispatch: # Permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Adiciona permissão de escrita (Isto está certo)
    permissions:
      contents: write

    steps:
      # 1. Traz o código. (Isto funcionou, check verde!)
      - uses: actions/checkout@v3
      
      # 2. Gera os arquivos SVG da cobrinha (Isto funcionou, check verde!)
      - uses: Platane/snk@v3
        with:
          github_user_name: vitorows
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Faz o commit e salva
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: '🐍 Gerar nova animação da cobrinha'
          file_pattern: 'dist/*.svg'
          # A LINHA 'branch: principal' FOI REMOVIDA DAQUI
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
